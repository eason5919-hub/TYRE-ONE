<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <!-- FORCE EVERYONE TO LATEST VERSION -->
  <script>
    const APP_VERSION = "202606180940";
    const url = new URL(window.location.href);

    if (url.searchParams.get("v") !== APP_VERSION) {
      url.searchParams.set("v", APP_VERSION);
      window.location.replace(url.toString());
    }
  </script>

  <!-- PREVENT IPHONE AUTO ZOOM -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <title>TYRE ONE Catalogue</title>

  <meta name="theme-color" content="#111111">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TYRE ONE">
  <link rel="manifest" href="manifest.webmanifest?v=202606180940">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=202606162610">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png?v=202606162610">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=202606162610">
  <link rel="stylesheet" href="style.css?v=202606162610">
</head>

<body>

  <!-- TAP VERY TOP OF SCREEN TO GO BACK TOP -->
  <div id="topTapZone"></div>

  <div id="loginScreen" class="loginScreen">
    <div class="loginBox">
      <h2>Login</h2>
      <p>Enter customer name and sales person WhatsApp number</p>

      <input type="text" id="loginName" placeholder="Customer Name">

      <input type="tel" id="loginPhone" placeholder="Sales Person WhatsApp. Example: 60123456789">

      <button id="loginButton">Continue</button>

      <small id="loginError"></small>
    </div>
  </div>

  <div id="appShell" class="appShell">

    <header id="mainHeader">
      <div class="topBar">
        <img src="TYRE ONE LOGO 2.png?v=202606162610" class="headerLogo" alt="TYRE ONE">

        <button id="refreshAppButton" title="Refresh App">
          Refresh
        </button>
      </div>

      <div class="searchBox">
        <input type="text" id="search" placeholder="Search tyre...">
        <button id="clearSearchButton" class="hidden" title="Clear Search">X</button>
      </div>

      <div class="headerActionRow">
        <button id="logoutButton">Logout</button>

        <div class="yearBox">
          <button id="yearButton" onclick="showYearDropdown(event)">YEAR</button>
        </div>

        <div class="pcdMenu">
          <button onclick="showSize('R12')">R12</button>
          <button onclick="showSize('R13')">R13</button>
          <button onclick="showSize('R14')">R14</button>
          <button onclick="showSize('R15')">R15</button>
          <button onclick="showSize('R16')">R16</button>
          <button onclick="showSize('R17')">R17</button>
          <button onclick="showSize('R18')">R18</button>
          <button onclick="showSize('R19')">R19</button>
          <button onclick="showSize('R20')">R20</button>
          <button onclick="showSize('R21')">R21</button>
          <button onclick="showSize('R22')">R22</button>
        </div>
      </div>

      <button id="cartButton">
        Cart (<span id="cartCount">0</span>)
      </button>
    </header>

    <div id="yearDropdown" class="yearDropdown hidden">
      <button onclick="clearYear()">ALL YEAR</button>
      <button onclick="showYear('Y20')">Y20</button>
      <button onclick="showYear('Y21')">Y21</button>
      <button onclick="showYear('Y22')">Y22</button>
      <button onclick="showYear('Y23')">Y23</button>
      <button onclick="showYear('Y24')">Y24</button>
      <button onclick="showYear('Y25')">Y25</button>
      <button onclick="showYear('Y26')">Y26</button>
    </div>

    <div id="brandCategoryBar" class="categoryMenu">
      <button class="brandCategoryButton textCategoryButton" data-category="ALL" onclick="showCategory('ALL')">
        ALL
      </button>

      <button class="brandCategoryButton" data-category="APLUS VIETNAM" onclick="showCategory('APLUS VIETNAM')">
        <img src="aplus-vietnam-logo.jpg?v=202606162610" alt="APLUS VIETNAM" onerror="brandLogoMissing(this)">
        <span>APLUS VIETNAM</span>
      </button>

      <button class="brandCategoryButton" data-category="APLUS" onclick="showCategory('APLUS')">
        <img src="aplus-logo.jpg?v=202606162610" alt="APLUS" onerror="brandLogoMissing(this)">
        <span>APLUS</span>
      </button>

      <button class="brandCategoryButton" data-category="ROCKBLADE" onclick="showCategory('ROCKBLADE')">
        <img src="rockblade-logo.jpg?v=202606162610" alt="ROCKBLADE" onerror="brandLogoMissing(this)">
        <span>ROCKBLADE</span>
      </button>

      <button class="brandCategoryButton" data-category="HILO" onclick="showCategory('HILO')">
        <img src="hilo-logo.jpg?v=202606162610" alt="HILO" onerror="brandLogoMissing(this)">
        <span>HILO</span>
      </button>

      <button class="brandCategoryButton" data-category="ARDENT" onclick="showCategory('ARDENT')">
        <img src="ardent-logo.jpg?v=202606162610" alt="ARDENT" onerror="brandLogoMissing(this)">
        <span>ARDENT</span>
      </button>

      <button class="brandCategoryButton" data-category="RAUFFAN" onclick="showCategory('RAUFFAN')">
        <img src="rauffan-logo.jpg?v=202606162610" alt="RAUFFAN" onerror="brandLogoMissing(this)">
        <span>RAUFFAN</span>
      </button>

      <button class="brandCategoryButton" data-category="CROSSMAXX" onclick="showCategory('CROSSMAXX')">
        <img src="crossmaxx-logo.jpg?v=202606162610" alt="CROSSMAXX" onerror="brandLogoMissing(this)">
        <span>CROSSMAXX</span>
      </button>

      <button class="brandCategoryButton" data-category="NEOLIN" onclick="showCategory('NEOLIN')">
        <img src="neolin-logo.jpg?v=202606162610" alt="NEOLIN" onerror="brandLogoMissing(this)">
        <span>NEOLIN</span>
      </button>

      <button class="brandCategoryButton" data-category="ROTALLA" onclick="showCategory('ROTALLA')">
        <img src="rotalla-logo.jpg?v=202606162610" alt="ROTALLA" onerror="brandLogoMissing(this)">
        <span>ROTALLA</span>
      </button>

      <button class="brandCategoryButton textCategoryButton" data-category="OTHERS" onclick="showCategory('OTHERS')">
        OTHERS
      </button>
    </div>

    <div id="productGrid" class="grid"></div>

  </div>

  <div id="cartPanel" class="hidden">
    <div class="cartHeader">
      <h2>Your Cart</h2>
      <button id="closeCart">X</button>
    </div>

    <button id="branchSettingButton" type="button">Branch Setting</button>
    <div id="branchSettingPanel" class="branchSettingPanel hidden"></div>

    <div id="cartItems"></div>

    <button id="sendWhatsapp">Send To WhatsApp</button>
  </div>

  <div id="photoViewer" class="hidden photoViewer">
    <div class="photoViewerBox">
      <button class="closeViewer" onclick="closePhotoViewer()">X</button>

      <h3 id="viewerTitle">Photo</h3>

      <img id="viewerImage" src="">

      <div class="viewerButtons">
        <button onclick="closePhotoViewer()">Close</button>
      </div>
    </div>
  </div>

  <div id="logoutConfirmOverlay" class="hidden confirmOverlay">
    <div class="confirmBox" onclick="event.stopPropagation()">
      <h3>Confirm Logout / 确认登出</h3>
      <p>Are you sure you want to log out? All current data, branch settings, and cart information will be reset.<br><br>您确定要登出吗？当前资料、分行设置和购物车内容将会被重置。</p>
      <div class="confirmActions">
        <button id="logoutConfirmCancel" type="button">Cancel / 取消</button>
        <button id="logoutConfirmOk" type="button">Logout / 登出</button>
      </div>
    </div>
  </div>

  <script src="script.js?v=202606180940"></script>

</body>
</html>
